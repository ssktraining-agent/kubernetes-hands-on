# Probes and graceful shutdown
#
# The most common production incident that traces back to a manifest is a
# rolling update that drops requests. It is almost always one of these three.
#
# 1. No startupProbe. A slow-starting app gets killed by its own livenessProbe
#    before it finishes booting, restarts, and loops. People fix this by
#    raising initialDelaySeconds on the liveness probe, which then delays
#    detection of a real hang for the rest of the pod's life. startupProbe
#    exists so you can be patient at boot and impatient afterwards.
#
# 2. readinessProbe and livenessProbe pointing at the same endpoint. If that
#    endpoint checks a dependency — a database, an upstream API — then a
#    dependency blip restarts every pod you have, at once.
#      readiness = "stop sending me traffic"
#      liveness  = "kill me, I am broken beyond recovery"
#    Liveness should test the process, not the world around it.
#
# 3. No preStop hook. When a pod is deleted, two things happen in parallel:
#    the kubelet sends SIGTERM, and the endpoints controller removes the pod
#    from Service endpoints. That second one is not instant — kube-proxy on
#    every node has to catch up. A pod that exits immediately on SIGTERM is
#    still receiving traffic when it goes. The sleep is not a workaround; it
#    is how you give the propagation time to finish.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo-secure
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never go below the declared replica count
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Must be longer than the preStop sleep plus the app's own drain time,
      # or the kubelet SIGKILLs you mid-drain.
      terminationGracePeriodSeconds: 45

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.30-alpine
          ports:
            - name: http
              containerPort: 8080

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          # Boot: allow up to 30 x 2s = 60 seconds, then give up.
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 30

          # Running: take me out of the Service quickly when I am busy.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Running: restart me only when the process itself is wedged.
          # Note this deliberately does NOT check the database.
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              # Wait for endpoint removal to propagate before shutting down.
              sleep:
                seconds: 15

          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 128Mi }

          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }

      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

# `lifecycle.preStop.sleep` is a native field — on by default since v1.30,
# GA in v1.34, feature gate removed in v1.37. Before it existed you wrote:
#
#   preStop:
#     exec:
#       command: ["sh", "-c", "sleep 15"]
#
# which required a shell in the image — so it silently did nothing on
# distroless and scratch images, and the drain problem stayed unexplained.
