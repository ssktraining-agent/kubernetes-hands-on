# Jobs: telling retries apart from failures
#
# The old Job API had one dial — backoffLimit — and it could not tell the
# difference between "the node was preempted, try again" and "the input file
# is malformed, trying again is pointless". So batch pipelines either burned
# their whole retry budget on infrastructure noise, or retried a permanent
# error six times before giving up.
#
# podFailurePolicy (GA in v1.31) reads the container's exit code and the pod's
# disruption condition, and decides per-failure.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-import
  namespace: demo-secure
spec:
  backoffLimit: 6
  # Cleans itself up 1 hour after finishing. Without this, completed Jobs
  # accumulate until someone notices 4,000 of them in etcd.
  ttlSecondsAfterFinished: 3600

  podFailurePolicy:
    rules:
      # Exit 42 means "bad input". Never retry, fail the whole Job now.
      - action: FailJob
        onExitCodes:
          containerName: importer
          operator: In
          values: [42]

      # Exit 1 is a transient error. Retry, but do not spend the budget:
      # Ignore means this failure is not counted against backoffLimit.
      - action: Ignore
        onExitCodes:
          containerName: importer
          operator: In
          values: [1]

      # The node was drained or preempted. Not the Job's fault; do not count it.
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget

  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: importer
          image: busybox:1.37
          command: ["sh", "-c", "echo importing; sleep 3; exit 0"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { memory: 64Mi }
---
# Indexed Jobs and successPolicy (GA in v1.33)
#
# An Indexed Job gives every pod a fixed index, 0..completions-1, in
# JOB_COMPLETION_INDEX. That is what makes sharded work possible: shard N
# processes partition N, and a retry of index 3 reprocesses partition 3.
#
# successPolicy says the Job is done when *enough* of them succeed. For a
# leader-elected or best-of-N workload, waiting for all 10 when 8 is the
# answer just wastes an hour.
apiVersion: batch/v1
kind: Job
metadata:
  name: sharded-report
  namespace: demo-secure
spec:
  completions: 10
  parallelism: 5
  completionMode: Indexed
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600

  successPolicy:
    rules:
      # Done once indexes 0-7 have succeeded, whatever 8 and 9 are doing.
      - succeededIndexes: "0-7"
      # Or: done once any 8 of the 10 have succeeded.
      # - succeededCount: 8

  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: shard
          image: busybox:1.37
          command:
            - sh
            - -c
            - 'echo "processing shard $JOB_COMPLETION_INDEX"; sleep $((JOB_COMPLETION_INDEX + 2))'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { memory: 64Mi }

# Watch the second one finish early:
#   kubectl -n demo-secure get job sharded-report -w
#   kubectl -n demo-secure get pods -l job-name=sharded-report
#
# The Job reports Complete while shards 8 and 9 are still running, and they
# are then terminated.
