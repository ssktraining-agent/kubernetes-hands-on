# Secret
#
# Worth being honest with a class about what this does and does not give you.
#
# A Secret is base64-encoded, not encrypted. Anyone who can `kubectl get
# secret -o yaml` can read it in one command. What a Secret adds over a
# ConfigMap is:
#
#   - it can be RBAC'd separately from ConfigMaps
#   - it is not written to the node's disk in plain text (tmpfs)
#   - it is excluded from most logging and describe output
#
# For encryption you need EncryptionConfiguration on the API server (etcd
# encryption at rest), or an external store — Vault, or a cloud secrets
# manager via the Secrets Store CSI driver.
#
# `stringData` takes plain text and encodes it for you. Use it; hand-rolled
# base64 in a manifest is how the wrong value gets committed.
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
stringData:
  database_password: "change-me"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-with-secret
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo port=$DATABASE_PORT; sleep 3600"]
      env:
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: database_port
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: database_password
