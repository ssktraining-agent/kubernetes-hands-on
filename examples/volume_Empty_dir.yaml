# emptyDir and hostPath
#
# `volumes` belongs to the POD spec, not to a container. It was nested inside
# the container here, which meant kubectl rejected the file.
#
# emptyDir: scratch space that lives as long as the pod. Deleted when the pod
#           is deleted — including on a reschedule. Not storage.
#
# hostPath: a directory on the node, mounted into the pod. Treat this as a
#           last resort. A pod with a hostPath mount can read and write the
#           node's filesystem, and the `restricted` Pod Security standard
#           rejects it outright. It also breaks the moment the pod is
#           rescheduled onto a different node, because the data was never
#           there.
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
    - name: my-container
      image: nginx:1.30
      volumeMounts:
        - name: my-emptydir
          mountPath: /tmp
        - name: my-hostpath
          mountPath: /var/log/nginx
  volumes:
    - name: my-emptydir
      emptyDir: {}
    - name: my-hostpath
      hostPath:
        path: /var/log/nginx
        type: DirectoryOrCreate
